[package]
name = "gerador-de-api-server"
version = "1.0.32"
edition = "2021"

[dependencies]
actix-rt = "2.10.0"
actix-web = "4.9.0"
async-process = "2.3.0"
sailfish = "0.9.0"
serde = { version = "1.0.209", features = ["std", "derive"] }
serde_json = "1.0.127"
toml = "0.8.19"
tracing = "0.1.40"
tracing-actix-web = "0.7.15"
env_logger = "0.11.5"
async-fs = "2.1.2"
futures-lite = "2.6.0"
utoipa = {version = "5", features = ["actix_extras"]}
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
utoipa-rapidoc = { version = "6.0.0", features = ["actix-web"] }
